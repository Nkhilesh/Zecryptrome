<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Money Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
    (function () {
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-black dark:text-neutral-100">
  <main class="mx-auto min-h-screen max-w-3xl border-x border-slate-200 bg-white px-4 pb-16 pt-4 dark:border-neutral-800 dark:bg-black">

    <header class="flex items-center gap-2">
      <a href="index.html" aria-label="Back to overview" class="rounded-lg p-1.5 hover:bg-slate-100 dark:hover:bg-neutral-900">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <h1 class="text-2xl font-semibold">Calendar</h1>
    </header>

    <!-- Month picker -->
    <div class="mt-6 flex items-center justify-between">
      <button id="prevMonth" type="button" aria-label="Previous month" class="rounded-lg p-2 hover:bg-slate-100 dark:hover:bg-neutral-900">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="text-center">
        <p id="monthLabel" class="font-semibold"></p>
        <button id="todayBtn" type="button" class="text-xs text-teal-700 hover:underline dark:text-teal-400">Today</button>
      </div>
      <button id="nextMonth" type="button" aria-label="Next month" class="rounded-lg p-2 hover:bg-slate-100 dark:hover:bg-neutral-900">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>

    <!-- Month totals -->
    <section class="mt-3 grid grid-cols-3 gap-2 text-center text-sm">
      <div class="rounded-xl bg-slate-50 p-2 dark:bg-neutral-900">
        <p class="text-xs text-slate-500 dark:text-neutral-400">In</p>
        <p id="totIn" class="font-semibold text-teal-700 dark:text-teal-400"></p>
      </div>
      <div class="rounded-xl bg-slate-50 p-2 dark:bg-neutral-900">
        <p class="text-xs text-slate-500 dark:text-neutral-400">Out</p>
        <p id="totOut" class="font-semibold text-red-500"></p>
      </div>
      <div class="rounded-xl bg-slate-50 p-2 dark:bg-neutral-900">
        <p class="text-xs text-slate-500 dark:text-neutral-400">Net</p>
        <p id="totNet" class="font-semibold"></p>
      </div>
    </section>
    <p id="totNote" class="mt-2 text-center text-xs text-slate-500 dark:text-neutral-400"></p>

    <!-- Filters / legend -->
    <div id="filters" class="mt-4 flex flex-wrap gap-2"></div>

    <!-- Calendar grid -->
    <section class="mt-4">
      <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-slate-500 dark:text-neutral-400">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div id="grid" class="mt-1 grid grid-cols-7 gap-1"></div>
    </section>

    <!-- Selected day -->
    <section class="mt-6 rounded-2xl border border-slate-200 p-4 dark:border-neutral-800">
      <div class="flex items-baseline justify-between gap-2">
        <h2 id="dayTitle" class="font-semibold"></h2>
        <p id="dayNet" class="text-sm font-semibold"></p>
      </div>
      <ul id="dayList" class="mt-3 divide-y divide-slate-200 dark:divide-neutral-800"></ul>
    </section>

    <!-- Upcoming -->
    <section class="mt-6">
      <h2 class="font-semibold">Coming up (next 30 days)</h2>
      <p id="upcomingTotal" class="mt-1 text-sm text-slate-500 dark:text-neutral-400"></p>
      <ul id="upcoming" class="mt-3 divide-y divide-slate-200 rounded-2xl border border-slate-200 dark:divide-neutral-800 dark:border-neutral-800"></ul>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="cloud-store.js"></script>
  <script src="cloud-bootstrap.js" data-scripts='["income-store.js", "expenses-store.js", "savings-store.js", "loans-engine.js", "calendar.js"]'></script>
</body>
</html>

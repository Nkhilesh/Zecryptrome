<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="stylesheet" href="mobile.css">
  <script src="mobile.js" defer></script>
  <title>Expenses</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
    (function () {
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      const dark = saved && saved !== "system" ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-black dark:text-neutral-100">
  <main class="mx-auto min-h-screen max-w-3xl border-x border-slate-200 bg-white px-4 pb-28 pt-4 dark:border-neutral-800 dark:bg-black">

    <header class="flex items-center gap-2">
      <a href="index.html" aria-label="Back to overview" class="rounded-lg p-1.5 hover:bg-slate-100 dark:hover:bg-neutral-900">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <h1 class="text-2xl font-semibold">Expenses</h1>
    </header>

    <!-- Add expense: type what you bought and the price (date, category or note can be changed by tapping it in History) -->
    <section class="mt-5 rounded-2xl border border-slate-200 p-4 dark:border-neutral-800">
      <h2 class="font-semibold">Add expense</h2>
      <form id="quickForm" novalidate class="mt-3 grid grid-cols-[minmax(0,1fr)_6.5rem_auto] gap-2">
        <input name="itemName" autocomplete="off" autocapitalize="sentences" enterkeyhint="next" maxlength="80"
          placeholder="Item, e.g. Soda" aria-label="Item" class="min-w-0 rounded-lg border border-slate-300 bg-white p-2 dark:border-neutral-700 dark:bg-neutral-900">
        <input name="price" type="number" inputmode="decimal" step="any" min="0" enterkeyhint="done"
          placeholder="Price (Rs)" aria-label="Price in rupees" class="min-w-0 rounded-lg border border-slate-300 bg-white p-2 dark:border-neutral-700 dark:bg-neutral-900">
        <button type="submit" class="rounded-lg bg-teal-600 px-4 font-medium text-white hover:bg-teal-500">Add</button>
      </form>
      <p id="quickHint" class="mt-1 text-xs text-slate-500 dark:text-neutral-400"></p>
    </section>

    <!-- This month -->
    <section class="mt-4 rounded-2xl bg-slate-50 p-4 dark:bg-black">
      <p class="font-medium text-slate-600 dark:text-neutral-300">Spent this month</p>
      <p id="monthSpent" class="mt-3 text-3xl font-bold">Rs 0</p>
      <div id="totalLimitWrap" class="mt-4 hidden">
        <div class="h-2 rounded-full bg-slate-200 dark:bg-neutral-800">
          <div id="totalLimitBar" class="h-2 rounded-full bg-teal-600" style="width: 0%"></div>
        </div>
        <p id="totalLimitText" class="mt-1 text-xs text-slate-500 dark:text-neutral-400"></p>
      </div>
      <p id="monthCompare" class="mt-2 text-sm text-slate-500 dark:text-neutral-400"></p>
    </section>

    <!-- Budget warnings -->
    <div id="alerts" class="mt-3 space-y-2"></div>

    <!-- Limits -->
    <section class="mt-6">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold">Monthly limits</h2>
        <button id="editLimits" type="button" class="rounded-full border border-slate-300 px-3 py-1 text-xs font-medium hover:bg-slate-100 dark:border-neutral-700 dark:hover:bg-neutral-800">Set limits</button>
      </div>
      <p id="noLimits" class="mt-2 text-sm text-slate-500 dark:text-neutral-400">No limits set. Set one to get a warning before you overspend.</p>
      <div id="limitList" class="mt-3 space-y-4"></div>
    </section>


    <!-- History -->
    <section class="mt-8">
      <h2 class="font-semibold">History</h2>
      <div class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-4">
        <input id="search" type="search" placeholder="Search" class="col-span-2 rounded-lg border border-slate-300 bg-white p-2 text-sm dark:border-neutral-700 dark:bg-neutral-900">
        <select id="filterCategory" class="rounded-lg border border-slate-300 bg-white p-2 text-sm dark:border-neutral-700 dark:bg-neutral-900">
          <option value="">All categories</option>
        </select>
        <select id="filterPeriod" class="rounded-lg border border-slate-300 bg-white p-2 text-sm dark:border-neutral-700 dark:bg-neutral-900">
          <option value="thisMonth">This month</option>
          <option value="lastMonth">Last month</option>
          <option value="last3">Last 3 months</option>
          <option value="thisYear">This year</option>
          <option value="all">All time</option>
          <option value="custom">Custom dates…</option>
        </select>
      </div>
      <div id="customRange" class="mt-2 hidden grid-cols-2 gap-2">
        <label class="text-xs text-slate-500 dark:text-neutral-400">From<input id="fromDate" type="date" class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-2 text-sm text-slate-900 dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-100"></label>
        <label class="text-xs text-slate-500 dark:text-neutral-400">To<input id="toDate" type="date" class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-2 text-sm text-slate-900 dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-100"></label>
      </div>
      <p id="filterTotal" class="mt-3 text-sm"></p>
      <div id="history" class="mt-2"></div>
    </section>

  </main>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed inset-x-0 bottom-24 z-50 hidden justify-center px-4">
    <div class="pointer-events-auto flex max-w-md items-center gap-3 rounded-xl bg-slate-900 px-4 py-3 text-sm text-white shadow-lg dark:bg-neutral-800">
      <span id="toastText"></span>
      <button id="toastUndo" type="button" class="hidden font-semibold text-teal-300">Undo</button>
    </div>
  </div>

  <!-- Expense popup (add / edit) -->
  <dialog id="expenseDialog" class="w-[90%] max-w-sm rounded-2xl p-6 backdrop:bg-black/60 dark:border dark:border-neutral-800 dark:bg-neutral-950 dark:text-neutral-100">
    <form id="expenseForm" class="space-y-3">
      <h2 id="expenseTitle" class="text-lg font-semibold">Add expense</h2>
      <input name="description" placeholder="What was it for?" required
        class="w-full rounded-lg border p-2 dark:border-neutral-700 dark:bg-neutral-900">
      <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount (Rs)" required
        class="w-full rounded-lg border p-2 dark:border-neutral-700 dark:bg-neutral-900">
      <select name="category" class="w-full rounded-lg border p-2 dark:border-neutral-700 dark:bg-neutral-900"></select>
      <input name="date" type="date" required class="w-full rounded-lg border p-2 dark:border-neutral-700 dark:bg-neutral-900">
      <input name="note" placeholder="Note (optional)" class="w-full rounded-lg border p-2 dark:border-neutral-700 dark:bg-neutral-900">
      <p id="expenseError" class="text-sm text-red-500"></p>
      <div class="flex gap-2">
        <button type="button" id="expenseDelete" class="hidden rounded-lg border border-red-300 px-3 text-red-500 dark:border-red-900">Delete</button>
        <button type="button" id="expenseCancel" class="flex-1 rounded-lg border p-2 dark:border-neutral-700">Cancel</button>
        <button type="submit" class="flex-1 rounded-lg bg-teal-600 p-2 text-white">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Limits popup -->
  <dialog id="limitsDialog" class="max-h-[90vh] w-[90%] max-w-sm rounded-2xl p-6 backdrop:bg-black/60 dark:border dark:border-neutral-800 dark:bg-neutral-950 dark:text-neutral-100">
    <form id="limitsForm" class="space-y-3">
      <h2 class="text-lg font-semibold">Monthly limits</h2>
      <p class="text-xs text-slate-500 dark:text-neutral-400">Leave blank for no limit. You'll get a warning at 80% and when you go over.</p>
      <label class="block text-sm font-medium">Total spending
        <input name="total" type="number" step="0.01" min="0" placeholder="No limit"
          class="mt-1 w-full rounded-lg border p-2 font-normal dark:border-neutral-700 dark:bg-neutral-900">
      </label>
      <div id="limitInputs" class="grid grid-cols-2 gap-2"></div>
      <div class="flex gap-2">
        <button type="button" id="limitsCancel" class="flex-1 rounded-lg border p-2 dark:border-neutral-700">Cancel</button>
        <button type="submit" class="flex-1 rounded-lg bg-teal-600 p-2 text-white">Save</button>
      </div>
    </form>
  </dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="cloud-store.js"></script>
  <script src="cloud-bootstrap.js" data-scripts='["expenses-store.js", "expenses.js"]'></script>
</body>
</html>
